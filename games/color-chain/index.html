<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <script>
      (function normalizeHost() {
        try {
          var host = location.hostname;
          if (!host || host.charAt(host.length - 1) !== ".") return;
          var url = new URL(location.href);
          url.hostname = host.replace(/\.+$/, "");
          if (url.hostname) location.replace(url.toString());
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="ws-api-origin" content="https://api.white-studio.org" />
    <meta
      name="description"
      content="Realtime four-color chain card battles. Challenge +4s, call last card, climb the board — White Studio Games."
    />
    <link rel="canonical" href="https://games.white-studio.org/games/color-chain/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="White Studio Games" />
    <meta property="og:url" content="https://games.white-studio.org/games/color-chain/" />
    <meta property="og:title" content="四色接龍 · Color Chain · White Studio Games" />
    <meta
      property="og:description"
      content="Realtime four-color chain card battles. Challenge +4s, call last card, climb the board."
    />
    <meta property="og:image" content="https://games.white-studio.org/assets/images/og/color-chain.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="四色接龍 · White Studio Games" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="四色接龍 · Color Chain · White Studio Games" />
    <meta
      name="twitter:description"
      content="Realtime four-color chain card battles. Challenge +4s, call last card, climb the board."
    />
    <meta name="twitter:image" content="https://games.white-studio.org/assets/images/og/color-chain.png" />
    <title data-i18n="meta.title_color_chain">Color Chain · White Studio Games</title>
    <link rel="icon" type="image/png" href="/assets/images/games/color-chain/icon.png" />
    <link rel="apple-touch-icon" href="/assets/images/games/color-chain/icon.png" />
    <link rel="stylesheet" href="/assets/css/ws-shared.css?v=20260803b" />
    <link rel="stylesheet" href="/assets/css/games-chrome.css?v=20260803b" />
    <link rel="stylesheet" href="./game.css?v=20260803b" />
  </head>
  <body class="games-page color-chain-page">
    <header class="ws-site-header">
      <div class="ws-site-header__inner">
        <a class="ws-brand" href="/" data-i18n-attr="aria-label:brand.home_aria">
          <img
            class="ws-brand__mark"
            src="/assets/images/white-studio-logo.png"
            alt=""
            aria-hidden="true"
          />
          <span class="ws-brand__text">
            <p class="ws-brand__title" data-i18n="brand.title">White Studio Games</p>
            <p class="ws-brand__sub" data-i18n="brand.sub">Arcade floor</p>
          </span>
        </a>
        <div class="ws-site-header__actions" data-ws-header-actions></div>
      </div>
    </header>

    <main class="ws-container ws-section ws-game-shell arcade-cabinet-shell">
      <div class="arcade-play-bar" aria-live="polite">
        <button type="button" class="ws-button ws-button--ghost" id="back-button" data-i18n="color_chain.back">
          Back to floor
        </button>
        <div class="arcade-play-bar__actions">
          <span class="arcade-hud__stat">
            <span data-i18n="color_chain.score">Score</span>
            <strong id="live-score">0</strong>
          </span>
        </div>
      </div>

      <div class="ws-game-hud arcade-hud arcade-hud__meta">
        <div>
          <p class="ws-card__eyebrow" data-i18n="color_chain.eyebrow">Arcade</p>
          <h1 class="ws-section__title arcade-hud__title" data-i18n="color_chain.title">Color Chain</h1>
        </div>
      </div>

      <section id="cc-lobby" class="cc-lobby">
        <div class="cc-panel" id="cc-setup">
          <h2 data-i18n="color_chain.lobby_title">Play Color Chain</h2>
          <p class="cc-lobby-lede" data-i18n="color_chain.lobby_lede">
            One tap starts a random room with AI. Invite friends anytime.
          </p>
          <div class="cc-form-row">
            <div class="ws-field">
              <label for="player-name" data-i18n="color_chain.nickname">Nickname</label>
              <input
                class="ws-input"
                id="player-name"
                maxlength="24"
                autocomplete="nickname"
                data-i18n-attr="placeholder:color_chain.nickname_ph"
                placeholder="Neon Fox"
              />
            </div>
          </div>
          <div class="cc-cta-stack">
            <button
              type="button"
              class="ws-button ws-button--primary cc-cta-primary"
              id="cc-quick-play"
              data-i18n="color_chain.quick_play"
            >
              Quick play
            </button>
            <div class="cc-cta-row">
              <button type="button" class="ws-button ws-button--ghost" id="cc-invite" data-i18n="color_chain.invite">
                Invite friends
              </button>
              <button type="button" class="ws-button ws-button--ghost" id="cc-show-join" data-i18n="color_chain.show_join">
                Join room
              </button>
            </div>
          </div>

          <div id="cc-secondary" class="cc-secondary" hidden>
            <div id="cc-invite-fields" hidden>
              <p class="cc-secondary-title" data-i18n="color_chain.invite_settings">Invite settings</p>
              <div class="cc-form-row">
                <div class="ws-field">
                  <label for="cc-max-players" data-i18n="color_chain.max_players">Players</label>
                  <select class="ws-input" id="cc-max-players">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                  </select>
                </div>
              </div>
              <label class="cc-check">
                <input type="checkbox" id="cc-fill-bots" />
                <span data-i18n="color_chain.fill_bots">Fill empty seats with AI</span>
              </label>
              <button
                type="button"
                class="ws-button ws-button--primary cc-cta-primary"
                id="cc-invite-create"
                data-i18n="color_chain.invite_create"
              >
                Create room
              </button>
            </div>
            <div id="cc-join-fields" hidden>
              <div class="cc-form-row">
                <div class="ws-field">
                  <label for="cc-code" data-i18n="color_chain.room_code">Room code</label>
                  <input class="ws-input" id="cc-code" maxlength="8" autocomplete="off" placeholder="ABCD12" />
                </div>
                <button type="button" class="ws-button ws-button--primary" id="cc-join" data-i18n="color_chain.join">
                  Join
                </button>
              </div>
            </div>
          </div>
          <p class="ws-status" id="cc-lobby-status"></p>
        </div>

        <div class="cc-panel" id="cc-waiting" hidden>
          <p class="cc-room-label" data-i18n="color_chain.waiting_title">Room</p>
          <p class="cc-room-code-display" id="cc-room-code" aria-live="polite"></p>
          <ul class="cc-seat-list" id="cc-seat-list"></ul>
          <p class="cc-share" id="cc-share"></p>
          <div class="cc-cta-row" id="cc-host-controls">
            <button type="button" class="ws-button ws-button--ghost" id="cc-copy-link" data-i18n="color_chain.copy_link">
              Copy link
            </button>
            <button type="button" class="ws-button ws-button--primary" id="cc-start" data-i18n="color_chain.start">
              Start match
            </button>
          </div>
        </div>
      </section>

      <div class="cc-table" id="cc-table" hidden data-skin="default">
        <div class="cc-table__top">
          <span class="cc-status" id="cc-status" data-i18n="color_chain.status_wait">Waiting…</span>
        </div>
        <div class="cc-opponents" id="cc-opponents"></div>
        <div class="cc-center">
          <div class="cc-pile" id="cc-draw-pile">
            <div class="cc-card cc-card--back"></div>
            <div class="cc-draw-count" id="cc-draw-count">Deck · 0</div>
          </div>
          <div class="cc-discard-wrap">
            <div class="cc-color-ring" id="cc-color-ring"></div>
            <div class="cc-pile" id="cc-discard"></div>
          </div>
        </div>
        <div class="cc-table-msg" id="cc-table-msg"></div>
        <div class="cc-fx-toast" id="cc-fx-toast" aria-live="polite" hidden></div>
        <div class="cc-hand cc-hand--me" id="cc-my-hand"></div>
        <div class="cc-fx-layer" id="cc-fx-layer" aria-hidden="true"></div>
      </div>

      <div class="cc-controls" id="cc-controls" hidden>
        <button type="button" class="ws-button ws-button--ghost" id="cc-draw-btn" data-i18n="color_chain.draw">
          Draw
        </button>
        <button type="button" class="ws-button ws-button--primary" id="cc-last-btn" hidden data-i18n="color_chain.call_last">
          Last card!
        </button>
        <button type="button" class="ws-button ws-button--ghost" id="cc-catch-btn" hidden data-i18n="color_chain.catch">
          Catch miss!
        </button>
        <button type="button" class="ws-button ws-button--primary" id="cc-challenge-btn" hidden data-i18n="color_chain.challenge">
          Challenge +4
        </button>
      </div>

      <section class="snake-result-sheet" id="result-sheet" hidden>
        <h2 data-i18n="color_chain.result_title">Match complete</h2>
        <p id="result-body"></p>
        <form class="score-form" id="score-form">
          <div class="ws-field">
            <label for="player-name-score" data-i18n="color_chain.nickname">Nickname</label>
            <input
              class="ws-input"
              id="player-name-score"
              name="playerName"
              maxlength="24"
              minlength="2"
              required
              autocomplete="nickname"
              data-i18n-attr="placeholder:color_chain.nickname_ph"
              placeholder="Neon Fox"
            />
          </div>
          <button type="submit" class="ws-button ws-button--primary">
            <span data-i18n="color_chain.submit">Submit</span>
            <span id="submit-score-value">0</span>
          </button>
        </form>
        <p class="ws-status" id="board-status" data-i18n="color_chain.loading">Loading…</p>
        <div class="snake-result-sheet__actions">
          <button type="button" class="ws-button ws-button--primary" id="again-button" data-i18n="color_chain.again">
            New room
          </button>
          <button type="button" class="ws-button ws-button--ghost" id="view-board-button" data-i18n="color_chain.view_board">
            View board
          </button>
        </div>
      </section>

      <section class="leaderboard-panel arcade-board" id="cc-leaderboard" aria-labelledby="board-title" hidden>
        <div class="leaderboard-panel__head">
          <h2 id="board-title" data-i18n="color_chain.board_title">High scores</h2>
          <button type="button" class="ws-button ws-button--ghost" id="refresh-board" data-i18n="color_chain.refresh">
            Refresh
          </button>
        </div>
        <div id="leaderboard-root"></div>
      </section>
    </main>

    <div class="cc-modal" id="cc-color-modal" role="dialog" aria-modal="true">
      <div class="cc-modal__card">
        <h3 data-i18n="color_chain.pick_color">Pick a color</h3>
        <div class="cc-color-grid">
          <button type="button" class="cc-swatch" data-color="red" aria-label="red"></button>
          <button type="button" class="cc-swatch" data-color="yellow" aria-label="yellow"></button>
          <button type="button" class="cc-swatch" data-color="green" aria-label="green"></button>
          <button type="button" class="cc-swatch" data-color="blue" aria-label="blue"></button>
        </div>
      </div>
    </div>

    <div class="cc-modal" id="cc-reveal-modal" role="dialog" aria-modal="true">
      <div class="cc-modal__card">
        <h3 data-i18n="color_chain.reveal_title">Hand reveal</h3>
        <div class="cc-reveal-hand" id="cc-reveal-hand"></div>
        <p id="cc-reveal-result"></p>
        <button type="button" class="ws-button ws-button--primary" id="cc-reveal-close" data-i18n="color_chain.reveal_ok">
          Continue
        </button>
      </div>
    </div>

    <footer class="ws-site-footer">
      <div class="ws-container ws-site-footer__inner">
        <a href="/" data-i18n="color_chain.footer_back">← Back to floor</a>
      </div>
    </footer>

    <div class="cc-title-banner" id="cc-title-banner" hidden aria-live="assertive">
      <div class="cc-title-banner__card">
        <p class="cc-title-banner__eyebrow" id="cc-title-eyebrow"></p>
        <h2 class="cc-title-banner__title" id="cc-title-main"></h2>
        <p class="cc-title-banner__sub" id="cc-title-sub"></p>
      </div>
    </div>

    <script src="/assets/js/i18n.js?v=20260803b"></script>
    <script src="/assets/js/games-auth.js"></script>
    <script src="/assets/js/games-api.js"></script>
    <script src="/assets/js/site-chrome.js?v=20260803b"></script>
    <script src="/assets/js/leaderboard-ui.js?v=20260802f"></script>
    <script src="/assets/js/naru-pet.js?v=20260802f"></script>
    <script src="./net.js?v=20260802f"></script>
    <script src="./render.js?v=20260802h"></script>
    <script src="./lobby.js?v=20260802f"></script>
    <script src="./game.js?v=20260802l"></script>
    <script>
      (async function boot() {
        var nick = document.getElementById("player-name");
        var nickScore = document.getElementById("player-name-score");
        await WhiteStudioGames.bootChrome({ nicknameInput: nick });
        if (nick && nickScore) {
          nickScore.value = nick.value;
          nick.addEventListener("change", function () {
            nickScore.value = nick.value;
          });
        }
        WhiteStudioLeaderboard.mountLeaderboard({
          api: WhiteStudioGames.createGamesApi(),
          gameId: "color-chain",
          boardRoot: document.getElementById("leaderboard-root"),
          statusEl: document.getElementById("board-status"),
          form: document.getElementById("score-form"),
          nameInput: nickScore,
          scoreValueEl: document.getElementById("submit-score-value"),
          refreshButton: document.getElementById("refresh-board"),
          limit: 20
        });
        var viewBoard = document.getElementById("view-board-button");
        if (viewBoard) {
          viewBoard.addEventListener("click", function () {
            document.body.classList.remove("is-cc-playing");
            document.getElementById("cc-leaderboard").hidden = false;
            document.getElementById("board-title").scrollIntoView({ behavior: "smooth" });
          });
        }
        if (window.WhiteStudioNaru) {
          WhiteStudioNaru.mount({ tips: false });
        }
        if (window.ColorChainGame && ColorChainGame.startGuide) {
          ColorChainGame.startGuide();
        }
      })();
    </script>
  </body>
</html>
