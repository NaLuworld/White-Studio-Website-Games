<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <script>
      // A trailing-dot hostname ("games.white-studio.org.") is served normally but sends an
      // Origin the API CORS allowlist rejects, so normalize it before any request is issued.
      (function normalizeHost() {
        try {
          var host = location.hostname;
          if (!host || host.charAt(host.length - 1) !== ".") return;
          var url = new URL(location.href);
          url.hostname = host.replace(/\.+$/, "");
          if (url.hostname) location.replace(url.toString());
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="ws-api-origin" content="https://api.white-studio.org" />
    <meta
      name="description"
      content="Classic grid snake. Eat neon bites (+10), grow longer, climb the board — White Studio Games."
    />
    <link rel="canonical" href="https://games.white-studio.org/games/snake/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="White Studio Games" />
    <meta property="og:url" content="https://games.white-studio.org/games/snake/" />
    <meta property="og:title" content="貪食蛇 · Snake · White Studio Games" />
    <meta
      property="og:description"
      content="Classic grid snake. Eat neon bites (+10), grow longer, climb the board."
    />
    <meta property="og:image" content="https://games.white-studio.org/assets/images/og/snake.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="貪食蛇 · White Studio Games" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="貪食蛇 · Snake · White Studio Games" />
    <meta
      name="twitter:description"
      content="Classic grid snake. Eat neon bites (+10), grow longer, climb the board."
    />
    <meta name="twitter:image" content="https://games.white-studio.org/assets/images/og/snake.png" />
    <title data-i18n="meta.title_snake">Snake · White Studio Games</title>
    <link rel="icon" type="image/png" href="/assets/images/games/snake/icon.png" />
    <link rel="apple-touch-icon" href="/assets/images/games/snake/icon.png" />
    <link rel="stylesheet" href="/assets/css/ws-shared.css?v=20260803b" />
    <link rel="stylesheet" href="/assets/css/games-chrome.css?v=20260803b" />
    <link rel="stylesheet" href="./game.css?v=20260802b" />
  </head>
  <body class="games-page snake-page">
    <header class="ws-site-header">
      <div class="ws-site-header__inner">
        <a class="ws-brand" href="/" data-i18n-attr="aria-label:brand.home_aria">
          <img
            class="ws-brand__mark"
            src="/assets/images/white-studio-logo.png"
            alt=""
            aria-hidden="true"
          />
          <span class="ws-brand__text">
            <p class="ws-brand__title" data-i18n="brand.title">White Studio Games</p>
            <p class="ws-brand__sub" data-i18n="brand.sub">Arcade floor</p>
          </span>
        </a>

        <div class="ws-site-header__actions" data-ws-header-actions></div>
      </div>
    </header>

    <main class="ws-container ws-section ws-game-shell arcade-cabinet-shell">
      <div class="arcade-play-bar" aria-live="polite">
        <button type="button" class="ws-button ws-button--ghost" id="back-button" data-i18n="snake.back">
          Back to floor
        </button>
        <div class="arcade-play-bar__actions">
          <span class="arcade-hud__stat">
            <span data-i18n="snake.score">Score</span>
            <strong id="play-score">0</strong>
          </span>
          <button type="button" class="ws-button ws-button--ghost" id="pause-button" data-i18n="snake.pause">
            Pause
          </button>
        </div>
      </div>

      <div class="ws-game-hud arcade-hud arcade-hud__meta">
        <div>
          <p class="ws-card__eyebrow" data-i18n="snake.eyebrow">Arcade</p>
          <h1 class="ws-section__title arcade-hud__title" data-i18n="snake.title">Snake</h1>
        </div>
        <div class="arcade-hud__stats" aria-live="polite">
          <span class="arcade-hud__stat">
            <span data-i18n="snake.score">Score</span>
            <strong id="live-score">0</strong>
          </span>
          <span class="arcade-hud__stat">
            <span data-i18n="snake.best">Best</span>
            <strong id="best-score">0</strong>
          </span>
        </div>
      </div>

      <div class="ws-game-stage arcade-stage">
        <canvas
          id="game-canvas"
          class="snake-canvas"
          tabindex="0"
          data-i18n-attr="aria-label:snake.canvas_aria"
        ></canvas>
        <div
          class="snake-overlay"
          id="game-overlay"
          role="dialog"
          aria-modal="true"
          aria-labelledby="overlay-title"
          aria-describedby="overlay-body"
        >
          <div class="snake-overlay__card arcade-overlay-card">
            <h2 id="overlay-title" data-i18n="snake.overlay_title">Snake</h2>
            <p id="overlay-body" data-i18n="snake.overlay_body">
              Swipe or tap the pad to turn. Eat bites for +10. Submit when the run ends.
            </p>
            <div class="arcade-overlay-card__actions" id="overlay-actions">
              <button type="button" class="ws-button ws-button--primary" id="start-button" data-i18n="snake.start">
                Start
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="snake-touch-pad" id="touch-pad" aria-hidden="true">
        <button type="button" class="snake-touch-pad__btn" data-dir="up" data-i18n-attr="aria-label:snake.pad_up">↑</button>
        <button type="button" class="snake-touch-pad__btn" data-dir="left" data-i18n-attr="aria-label:snake.pad_left">←</button>
        <button type="button" class="snake-touch-pad__btn" data-dir="right" data-i18n-attr="aria-label:snake.pad_right">→</button>
        <button type="button" class="snake-touch-pad__btn" data-dir="down" data-i18n-attr="aria-label:snake.pad_down">↓</button>
      </div>

      <section class="snake-result-sheet" id="result-sheet" hidden>
        <h2 data-i18n="snake.result_title">Run complete</h2>
        <p id="result-body">Score 0. Play again or submit to the board.</p>
        <form class="score-form" id="score-form">
          <div class="ws-field">
            <label for="player-name" data-i18n="snake.nickname">Nickname</label>
            <input
              class="ws-input"
              id="player-name"
              name="playerName"
              maxlength="24"
              minlength="2"
              required
              autocomplete="nickname"
              inputmode="text"
              enterkeyhint="done"
              data-i18n-attr="placeholder:snake.nickname_ph"
              placeholder="Neon Fox"
            />
          </div>
          <button type="submit" class="ws-button ws-button--primary">
            <span data-i18n="snake.submit">Submit</span>
            <span id="submit-score-value">0</span>
          </button>
        </form>
        <p class="ws-status" id="board-status" data-i18n="snake.loading">Loading…</p>
        <div class="snake-result-sheet__actions">
          <button type="button" class="ws-button ws-button--primary" id="again-button" data-i18n="snake.again">
            Play again
          </button>
          <button type="button" class="ws-button ws-button--ghost" id="view-board-button" data-i18n="snake.view_board">
            View board
          </button>
        </div>
      </section>

      <section class="leaderboard-panel arcade-board" aria-labelledby="board-title">
        <div class="leaderboard-panel__head">
          <h2 id="board-title" data-i18n="snake.board_title">High scores</h2>
          <button type="button" class="ws-button ws-button--ghost" id="refresh-board" data-i18n="snake.refresh">
            Refresh
          </button>
        </div>
        <div id="leaderboard-root"></div>
      </section>
    </main>

    <footer class="ws-site-footer">
      <div class="ws-container ws-site-footer__inner">
        <a href="/" data-i18n="snake.footer_back">← Back to floor</a>
      </div>
    </footer>

    <script src="/assets/js/i18n.js?v=20260803b"></script>
    <script src="/assets/js/games-auth.js"></script>
    <script src="/assets/js/games-api.js"></script>
    <script src="/assets/js/site-chrome.js?v=20260803b"></script>
    <script src="/assets/js/leaderboard-ui.js?v=20260802b"></script>
    <script src="/assets/js/naru-pet.js?v=20260802b"></script>
    <script src="./game.js?v=20260802b"></script>
    <script>
      (async function boot() {
        await WhiteStudioGames.bootChrome({
          nicknameInput: document.getElementById("player-name")
        });
        WhiteStudioLeaderboard.mountLeaderboard({
          api: WhiteStudioGames.createGamesApi(),
          gameId: "snake",
          boardRoot: document.getElementById("leaderboard-root"),
          statusEl: document.getElementById("board-status"),
          form: document.getElementById("score-form"),
          nameInput: document.getElementById("player-name"),
          scoreValueEl: document.getElementById("submit-score-value"),
          refreshButton: document.getElementById("refresh-board"),
          limit: 20
        });
        if (window.WhiteStudioNaru) {
          WhiteStudioNaru.mount({
            tips: [
              { key: "naru.tip_snake_controls", anim: "point_down", target: "#game-canvas", holdAnim: "look_user" },
              { key: "naru.tip_snake_submit", anim: "wave" },
              { key: "naru.tip_snake_back", anim: "point_up", target: ".ws-brand", holdAnim: "look_user" }
            ]
          });
        }
      })();
    </script>
  </body>
</html>
